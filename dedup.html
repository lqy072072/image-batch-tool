<body>
<div class="dup-panel" id="dupPanel">
  <div class="dup-head" id="dupHead">
    <div class="ops" style="display:flex;align-items:center;gap:8px">
      <div class="light red" onclick="post('dupwinclose')" title="关闭"></div>
      <div class="light yellow" onclick="post('dupwinmin')" title="最小化"></div>
      <div class="light green" onclick="post('dupwinmax')" title="最大化"></div>
    </div>
    <div class="title-wrap"><span class="t">照片去重</span><span class="s" id="dupHeadSub"></span></div>
  </div>
  <div class="dup-tools">
    <button class="mini-btn" onclick="post('dupalbum')">相册全部</button>
    <button class="mini-btn" onclick="post('dupsrc')">指定文件夹</button>
    <button class="mini-btn" onclick="post('dupscan')">开始扫描</button>
    <button class="mini-btn" id="dupPauseBtn" onclick="post('duppause')">暂停</button>
    <span style="font-size:10px;color:#9a9a9a">相似阈值</span>
    <input class="dup-thr" id="dupThr" type="number" min="2" max="14" step="1" value="6" title="越小越严格；2 最严格，14 最宽松" onchange="dupSetThreshold(this.value)">
    <span style="font-size:10px;color:#9a9a9a">保留优先</span>
    <select class="dup-rule" id="dupRule" onchange="dupSetRule(this.value)">
      <option value="resolution">分辨率/体积</option>
      <option value="folder">文件夹层级</option>
      <option value="newest">修改时间较新</option>
      <option value="oldest">修改时间较早</option>
      <option value="rating">收藏/评分</option>
    </select>
    <button class="mini-btn" id="dupIgnoreBtn" onclick="dupToggleIgnored()">显示忽略</button>
    <span style="font-size:11px;color:#9a9a9a" id="dupDstPath">移入：软件回收站</span>
    <div class="dup-bar" style="flex:0 0 100px;margin:0"><div id="dupBarFill"></div></div>
    <span style="font-size:11px;color:#9a9a9a;min-width:52px" id="dupStat">未扫描</span>
    <span style="flex:1"></span>
    <button class="mini-btn" onclick="dupSelectAll(true)">全选多余</button>
    <button class="mini-btn" onclick="dupSelectAll(false)">全不选</button>
    <span style="font-size:11px;color:#9a9a9a" id="dupSelInfo">已选 0 张</span>
    <button class="mini-btn" style="background:#b33;color:#fff;border-color:#c44" onclick="dupMoveSelected()">移入回收站</button>
  </div>
  <div class="dup-path" id="dupSrcPath" title="">扫描：未选择文件夹</div>
  <div class="dup-list" id="dupList"><div class="dup-empty">还没有扫描结果，点上方「开始扫描」开始。</div></div>
</div>
<div class="dup-light" id="dupLight">
  <div class="dup-light-info" id="dupLightInfo"></div>
  <img id="dupLightImg" src="" alt="">
  <div class="dup-light-nav">
    <button onclick="dupLightStep(-1)">‹ 上一张</button>
    <button onclick="dupLightStep(1)">下一张 ›</button>
    <button onclick="closeDupLight()">关闭</button>
  </div>
</div>
<script>
function post(m){ try{ if(window.chrome&&chrome.webview) chrome.webview.postMessage(m); }catch(e){} }
function fmtSize(n){ if(!n) return "0 B"; const u=["B","KB","MB","GB"]; let i=0,v=n; while(v>=1024&&i<u.length-1){v/=1024;i++;} return (i===0? v : v.toFixed(1))+" "+u[i]; }
function escHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function dupFolder(p){
  p=String(p==null?"":p);
  const i=Math.max(p.lastIndexOf("\\"),p.lastIndexOf("/"));
  return i>=0?p.slice(0,i):"";
}
window._dupGroups=[]; window._dupSel={}; window._dupUserSel={}; window._dupThumbs={}; window._dupMoveList=[]; window._dupSrc=""; window._dupDst=""; window._dupRunning=false; window._dupPaused=false; window._dupScanning=false; window._dupScanDone=false; window._dupRule="resolution"; window._dupShowIgnored=false;
try{ window._dupRule=localStorage.getItem("ibt_dup_rule")||"resolution"; }catch(e){}
try{ window._dupIgnored=JSON.parse(localStorage.getItem("ibt_dup_ignored")||"{}"); }catch(e){ window._dupIgnored={}; }
function dupSaveIgnored(){ try{ localStorage.setItem("ibt_dup_ignored",JSON.stringify(window._dupIgnored||{})); }catch(e){} }
function dupGroupKey(g){ return (g.items||[]).map(function(x){return String(x.p||"").toLowerCase();}).sort().join("\n"); }
function dupSortGroup(g){
  const arr=g.items||[];
  const rule=window._dupRule||"resolution";
  arr.sort(function(a,b){
    if(rule==="folder"){
      const da=String(a.fp||"").length, db=String(b.fp||"").length;
      if(da!==db) return da-db;
      return String(a.fp||"").localeCompare(String(b.fp||""));
    }
    if(rule==="newest") return (b.mt||0)-(a.mt||0);
    if(rule==="oldest") return (a.mt||0)-(b.mt||0);
    if(rule==="rating"){
      const ra=Number(a.m&&a.m.r)||0, rb=Number(b.m&&b.m.r)||0;
      if(ra!==rb) return rb-ra;
      const fa=(a.m&&a.m.f)?1:0, fb=(b.m&&b.m.f)?1:0;
      if(fa!==fb) return fb-fa;
    }
    const pa=(a.w||0)*(a.h||0), pb=(b.w||0)*(b.h||0);
    if(pa!==pb) return pb-pa;
    if((b.s||0)!==(a.s||0)) return (b.s||0)-(a.s||0);
    return (b.mt||0)-(a.mt||0);
  });
}
function dupApplyRule(resetSel){
  const gs=window._dupGroups||[];
  for(let i=0;i<gs.length;i++) dupSortGroup(gs[i]);
  if(resetSel){
    window._dupSel={}; window._dupUserSel={};
    for(let i=0;i<gs.length;i++){
      const g=gs[i].items||[];
      if(window._dupIgnored[dupGroupKey(gs[i])] && !window._dupShowIgnored) continue;
      for(let k=1;k<g.length;k++){ window._dupSel[g[k].p]=true; window._dupUserSel[g[k].p]=true; }
    }
    dupUpdateSelInfo();
  }
}
function dupSetRule(v){
  window._dupRule=v||"resolution";
  try{ localStorage.setItem("ibt_dup_rule",window._dupRule); }catch(e){}
  window._dupUserSel={};
  dupApplyRule(true); renderDupGroups();
}
function dupSetThreshold(v){
  let n=Math.max(2,Math.min(14,parseInt(v,10)||6));
  const el=document.getElementById("dupThr"); if(el) el.value=n;
  post("dupset|"+n);
  window._dupPendingThreshold=n;
  if(window._dupRunning){
    window._dupNeedRescan=true;
    const st=document.getElementById("dupStat");
    if(st) st.textContent="阈值已改为 "+n+"，本轮扫描结束后请重新扫描";
    return;
  }
  dupClearForThreshold(n);
}
function dupClearForThreshold(n){
  window._dupNeedRescan=false;
  window._dupGroups=[]; window._dupSel={}; window._dupUserSel={}; window._dupMoveList=[];
  window._dupScanDone=false; window._dupScanning=false;
  const st=document.getElementById("dupStat"); if(st) st.textContent="阈值已改为 "+n+"，请重新扫描";
  const sub=document.getElementById("dupHeadSub"); if(sub) sub.textContent="阈值已改变 · 未扫描";
  const bar=document.getElementById("dupBarFill"); if(bar) bar.style.width="0%";
  renderDupGroups();
}
function dupToggleIgnored(){ window._dupShowIgnored=!window._dupShowIgnored; const b=document.getElementById("dupIgnoreBtn"); if(b) b.textContent=window._dupShowIgnored?'隐藏忽略':'显示忽略'; renderDupGroups(); }
function dupIgnoreGroup(gi){
  const g=(window._dupGroups||[])[gi]; if(!g) return;
  const k=dupGroupKey(g);
  if(window._dupIgnored[k]) delete window._dupIgnored[k]; else window._dupIgnored[k]=1;
  if(window._dupIgnored[k]){
    // 被忽略的组不可见，必须同时从选择集合移除，防止「移入回收站」误操作隐藏文件。
    const items=g.items||[];
    for(let i=0;i<items.length;i++){ delete window._dupSel[items[i].p]; delete window._dupUserSel[items[i].p]; }
    const ml=window._dupMoveList||[]; window._dupMoveList=ml.filter(function(p){ return items.every(function(it){ return it.p!==p; }); });
  }
  dupSaveIgnored(); if(!window._dupIgnored[k]) { dupApplyRule(false); } renderDupGroups();
}
let _dupLightG=null,_dupLightK=0;
function dupUpdateSelInfo(){
  const n=Object.keys(window._dupSel||{}).filter(function(k){return window._dupSel[k];}).length;
  const el=document.getElementById("dupSelInfo"); if(el) el.textContent="已选 "+n+" 张";
}
function renderDupGroups(){
  const list=document.getElementById("dupList"); if(!list) return;
  const gs=window._dupGroups||[];
  const visible=gs.filter(function(g){ return !(window._dupIgnored&&window._dupIgnored[dupGroupKey(g)]&&!window._dupShowIgnored); });
  if(!visible.length){ list.innerHTML='<div class="dup-empty">'+(window._dupScanning?'扫描中，发现重复后会立即显示…':'没有发现重复照片')+'</div>'; dupUpdateSelInfo(); return; }
  const keepScroll=list.scrollTop||0;
  let html="";
  for(let vi=0;vi<visible.length;vi++){
    const g=visible[vi], gi=gs.indexOf(g), g2=g.items||[];
    const kind=g.k==="exact"?"完全重复":"相似重复";
    const extra=g.k==="exact"?"哈希一致":"差异 "+Number(g.sim||0)+"/64";
    html+='<div class="dup-group"><div class="dup-group-h"><span>第 '+(vi+1)+' 组 · '+g2.length+' 张 <span class="dup-kind'+(g.k==="exact"?"":" sim")+'">'+kind+' · '+extra+'</span></span><span>第 1 张按当前规则保留<button class="dup-ignore" onclick="dupIgnoreGroup('+gi+')">'+(window._dupIgnored&&window._dupIgnored[dupGroupKey(g)]?'取消忽略':'忽略本组')+'</button></span></div><div class="dup-cells">';
    for(let k=0;k<g2.length;k++){
      const it=g2[k]; const ck=!!window._dupSel[it.p];
      const dt=window._dupThumbs&&window._dupThumbs[it.p];
      const folder=dupFolder(it.p);
      html+='<div class="dup-cell '+(k===0?"keep":"")+(ck?" out":"")+'" data-dp="'+escHtml(it.p)+'">'
        + (dt?'<img src="'+dt+'" onclick="dupOpenLight('+gi+','+k+')" title="点击放大对比">':'<div class="ph" onclick="dupOpenLight('+gi+','+k+')">载入中…</div>')
        + '<div class="nm" title="'+escHtml(it.n)+'">'+escHtml(it.n)+'</div>'
        + '<div class="fd" title="所在文件夹：'+escHtml(folder||it.p)+'">'+escHtml(folder||"—")+'</div>'
        + '<div class="mt">'+(it.w?it.w+"×"+it.h:"—")+' · '+fmtSize(it.s)+'</div>'
        + '<div class="mk">'+(it.m&&it.m.f?'★ 收藏 · ':'')+(it.m&&it.m.r?'评分 '+it.m.r+'/5':'')+'</div>'
        + ((it.c&&it.c.length)?'<div class="mt" style="color:#7fb0ff" title="'+escHtml(it.c.join(", "))+'">实况：'+escHtml(it.c.join(", "))+'</div>':'')
        + (it.d===0?'<div class="mt" style="color:#c9a227">无解码器 · 仅精确判重</div>':'')
        + '<label><input type="checkbox" data-p="'+escHtml(it.p)+'" '+(ck?"checked":"")+' onchange="dupToggle(this)"> 移入回收站'+(k===0?'（保留项）':'')+'</label>'
        + '</div>';
    }
    html+="</div></div>";
  }
  list.innerHTML=html; dupUpdateSelInfo();
  list.scrollTop=keepScroll;
  window._dupThumbReq=window._dupThumbReq||{};
  list._dupThumbCursor=0;
  if(!list._thumbScroll){ list._thumbScroll=true; list.addEventListener('scroll', function(){ if((Date.now()-(list._thumbT||0))>120){ list._thumbT=Date.now(); dupQueueThumbs(); } }); }
  dupQueueThumbs();
}
function dupQueueThumbs(){
  const list=document.getElementById("dupList"); if(!list) return;
  window._dupThumbReq=window._dupThumbReq||{};
  const cells=list.querySelectorAll(".dup-cell");
  let start=list._dupThumbCursor||0, sent=0;
  for(let i=start;i<cells.length && sent<120;i++){
    const p=cells[i].getAttribute("data-dp");
    list._dupThumbCursor=i+1;
    if(!p || window._dupThumbReq[p]) continue;
    if(cells[i].querySelector("img")) continue;
    window._dupThumbReq[p]=1; post("dupthumb|"+p); sent++;
  }
}
function dupFillThumb(path,data){
  const list=document.getElementById("dupList"); if(!list||!data) return;
  const cells=list.querySelectorAll(".dup-cell");
  for(let i=0;i<cells.length;i++){
    if(cells[i].getAttribute("data-dp")!==path) continue;
    const ph=cells[i].querySelector(".ph");
    if(ph && !cells[i].querySelector("img")){
      const im=document.createElement("img"); im.src=data; im.alt=""; im.title="点击放大对比";
      im.onclick=(function(pp){ return function(){ dupOpenLightByPath(pp); }; })(path);
      cells[i].insertBefore(im, cells[i].firstChild);
      ph.remove();
    }
    return;
  }
}
function dupToggle(cb){
  const p=cb.getAttribute("data-p");
  window._dupSel[p]=cb.checked;
  window._dupUserSel[p]=cb.checked;
  cb.parentNode.parentNode.classList.toggle("out",cb.checked);
  dupUpdateSelInfo();
}
function dupSelectAll(v){
  const gs=window._dupGroups||[];
  window._dupSel={}; window._dupUserSel={};
  for(let gi=0;gi<gs.length;gi++){
    if(window._dupIgnored&&window._dupIgnored[dupGroupKey(gs[gi])]&&!window._dupShowIgnored) continue;
    dupSortGroup(gs[gi]);
    const g=gs[gi].items||[];
    for(let k=0;k<g.length;k++){
      const on=!!(v&&k>0);
      window._dupSel[g[k].p]=on; window._dupUserSel[g[k].p]=on;
    }
  }
  renderDupGroups();
}
function dupOpenLightByPath(path){
  const gs=window._dupGroups||[];
  for(let gi=0;gi<gs.length;gi++){
    const g=gs[gi].items||[];
    for(let k=0;k<g.length;k++) if(g[k].p===path){ dupOpenLight(gi,k); return; }
  }
}
function dupMoveSelected(){
  const sel=Object.keys(window._dupSel||{}).filter(function(k){
    if(!window._dupSel[k]) return false;
    // 只允许移动当前可见组里的勾选项，忽略组/已隐藏组一律跳过。
    const gs=window._dupGroups||[];
    for(let gi=0;gi<gs.length;gi++){
      const g=gs[gi];
      if(window._dupIgnored&&window._dupIgnored[dupGroupKey(g)]&&!window._dupShowIgnored) continue;
      if((g.items||[]).some(function(it){ return it.p===k; })) return true;
    }
    return false;
  });
  if(!sel.length){ alert("还没有勾选要移出的照片。"); return; }
  const dst=window._dupDst||"软件回收站";
  if(!confirm("将把 "+sel.length+" 张照片移入回收站：\n"+dst+"\n\n不会直接删除文件，可在相册「回收站」里还原或彻底删除。")) return;
  window._dupMoveList=sel.slice();
  post("dupmove|"+sel.join("\n"));
}
function dupOpenLight(gi,k){
  _dupLightG=gi; _dupLightK=k;
  document.getElementById("dupLight").style.display="flex";
  dupLoadLight();
}
function dupLoadLight(){
  const g=(window._dupGroups||[])[_dupLightG]; if(!g) return;
  const g2=g.items||[]; const it=g2[_dupLightK]; if(!it) return;
  post("duppreview|"+it.p);
  const info=document.getElementById("dupLightInfo");
  if(info) info.textContent="第 "+(_dupLightG+1)+" 组 · "+( _dupLightK+1)+" / "+g2.length+"　"+it.w+"×"+it.h+" · "+fmtSize(it.s);
}
function dupLightStep(d){
  const g=(window._dupGroups||[])[_dupLightG]; if(!g) return;
  const n=(g.items||[]).length;
  _dupLightK=(_dupLightK+d+n)%n;
  document.getElementById("dupLightImg").src="";
  dupLoadLight();
}
function closeDupLight(){ document.getElementById("dupLight").style.display="none"; document.getElementById("dupLightImg").src=""; }
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ const l=document.getElementById("dupLight"); if(l&&l.style.display==="flex") closeDupLight(); } });
function handleMessage(m){
  if(!m||!m.type) return;
  if(m.type==='dupstate'){
    window._dupSrc=m.src||''; window._dupDst=m.dst||'';
    const sp=document.getElementById('dupSrcPath'), dp=document.getElementById('dupDstPath');
    if(sp) sp.textContent='扫描：'+(m.src?m.src:'未选择文件夹');
    if(dp) dp.textContent='移入：'+(m.dst?'回收站 '+m.dst:'软件回收站');
    if(sp) sp.title=m.src||''; if(dp) dp.title=m.dst||'';
    window._dupRunning=!!m.running; window._dupPaused=!!m.paused; window._dupScanning=!!m.running;
    if(window._dupNeedRescan && !window._dupRunning){
      dupClearForThreshold(window._dupPendingThreshold||6);
    }
    const pb=document.getElementById('dupPauseBtn'); if(pb) pb.textContent=m.paused?'继续':'暂停';
    const th=document.getElementById('dupThr'); if(th && m.threshold) th.value=m.threshold;
  } else if(m.type==='dup'){
    const bar=document.getElementById('dupBarFill'), st=document.getElementById('dupStat');
    if(m.phase==='pause'){ window._dupScanning=true; if(st) st.textContent='已暂停 '+m.done+' / '+m.total; }
    else if(m.phase==='done'){ window._dupScanning=false; window._dupScanDone=true; if(bar) bar.style.width='100%'; if(st) st.textContent='扫描完成：'+(m.groups||0)+' 组重复，共处理 '+m.total+' 张'; }
    else if(m.phase==='error'){ window._dupScanning=false; window._dupScanDone=true; if(st) st.textContent='扫描出错：'+(m.msg||''); }
    else {
      window._dupScanning=true; window._dupScanDone=false;
      const pct=m.total?Math.round(m.done/m.total*100):0; if(bar) bar.style.width=pct+'%';
      if(m.phase==='enum'){
        window._dupGroups=[]; window._dupSel={}; window._dupUserSel={}; window._dupThumbs={}; window._dupThumbReq={};
        if(st) st.textContent='正在枚举文件…';
        renderDupGroups();
      }
      else if(st) st.textContent=(m.phase==='compare'?'正在比对相似度…':'扫描中 '+m.done+' / '+m.total);
    }
  } else if(m.type==='dupgroups'){
    window._dupGroups=m.items||[];
    for(let gi=0;gi<window._dupGroups.length;gi++) dupSortGroup(window._dupGroups[gi]);
    window._dupUserSel=window._dupUserSel||{};
    const valid={};
    for(let gi=0;gi<window._dupGroups.length;gi++){
      const g=window._dupGroups[gi].items||[];
      for(let k=0;k<g.length;k++){
        const p=g[k].p; valid[p]=1;
        if(Object.prototype.hasOwnProperty.call(window._dupUserSel,p)) window._dupSel[p]=!!window._dupUserSel[p];
        else window._dupSel[p]=(k>0);
      }
    }
    for(const p in window._dupSel){ if(!valid[p]) delete window._dupSel[p]; }
    const sub=document.getElementById('dupHeadSub');
    if(sub) sub.textContent=(m.partial?'扫描中 · ':'')+(m.total||0)+' 组 · 已分析 '+(m.files||0)+' 张';
    renderDupGroups();
  } else if(m.type==='dupbig'){
    const li=document.getElementById('dupLightImg'), info=document.getElementById('dupLightInfo');
    if(li) li.src=m.data;
    if(info) info.innerHTML='<b>'+escHtml(m.n)+'</b><br>'+m.w+' × '+m.h+'　'+fmtSize(m.s)+'<br><span style="color:#888">'+escHtml(m.p)+'</span>';
  } else if(m.type==='dupthumb'){
    if(m.t){ window._dupThumbs=window._dupThumbs||{}; window._dupThumbs[m.p]=m.t; }
    dupFillThumb(m.p,m.t);
  } else if(m.type==='dupwarm'){
    const st=document.getElementById('dupStat');
    if(st && !window._dupRunning && !window._dupScanDone && !(window._dupGroups||[]).length && m.total) st.textContent='后台预分析 '+m.done+' / '+m.total+(m.finished?' · 已完成':'');
  } else if(m.type==='dupdone'){
    const st=document.getElementById('dupStat');
    if(st) st.textContent='已移入回收站 '+(m.moved||0)+' 张'+(m.comps?'（含 '+m.comps+' 个伴生文件）':'')+(m.failed?'，失败 '+m.failed:'')+'，可在相册「回收站」还原';
    const moved=window._dupMoveList||[];
    for(let i=0;i<moved.length;i++) delete window._dupSel[moved[i]];
    window._dupGroups=(window._dupGroups||[]).filter(function(g){ const kept=(g.items||[]).filter(function(it){ return !moved.includes(it.p); }); g.items=kept; return kept.length>=2; });
    window._dupMoveList=[]; renderDupGroups();
  }
}
if(window.chrome&&chrome.webview){
  chrome.webview.addEventListener('message', function(e){ handleMessage(e.data); });
  window.addEventListener('load', function(){ setTimeout(function(){ post('dupshow'); }, 120); });
  setTimeout(function(){ post('dupshow'); }, 500);
}
(function(){
  var head=document.getElementById('dupHead');
  if(!head) return;
  head.addEventListener('mousedown', function(e){
    if(e.button!==0) return;
    if(e.target.closest && e.target.closest('.light')) return;
    post('dupdragstart');
  });
  head.addEventListener('dblclick', function(e){
    if(e.target.closest && e.target.closest('.light')) return;
    post('dupwinmax');
  });
})();
</script>
</body>
</html>
